<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen blanc Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f0e8;
  --surface: #fffdf8;
  --surface-2: #f8f5ee;
  --ink: #1a2332;
  --muted: #5d6574;
  --line: #ddd6c6;
  --accent: #1e3a5f;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9f1;
  --ok: #2c7a4b;
  --ok-soft: #e2f1e7;
  --ko: #b03434;
  --ko-soft: #f8e3e1;
  --warn: #b5650d;
  --code-bg: #1d2533;
  --code-ink: #e9e4d6;
  --code-line: #2c3646;
  --c-H: #c0531b;
  --c-C: #2867ad;
  --c-J: #9a7a06;
  --c-I: #6a4aa3;
  --shadow: 0 1px 2px rgba(26,35,50,.06), 0 4px 16px rgba(26,35,50,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --surface-2: #161b23; --ink: #e8e6e0; --muted: #9aa3b2; --line: #2d3542;
    --accent: #8fb4e3; --accent-ink: #10161f; --accent-soft: #1f2c3d; --ok: #6cc391; --ok-soft: #173325; --ko: #f08a84; --ko-soft: #3a1d1d;
    --warn: #f0a650; --code-bg: #0e1218; --code-ink: #e3dfd3; --code-line: #232b37;
    --c-H: #f08a52; --c-C: #6aa8ec; --c-J: #e0bf45; --c-I: #b097e6; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --surface-2: #161b23; --ink: #e8e6e0; --muted: #9aa3b2; --line: #2d3542;
  --accent: #8fb4e3; --accent-ink: #10161f; --accent-soft: #1f2c3d; --ok: #6cc391; --ok-soft: #173325; --ko: #f08a84; --ko-soft: #3a1d1d;
  --warn: #f0a650; --code-bg: #0e1218; --code-ink: #e3dfd3; --code-line: #232b37;
  --c-H: #f08a52; --c-C: #6aa8ec; --c-J: #e0bf45; --c-I: #b097e6; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 "IBM Plex Sans", system-ui, sans-serif;
  min-height: 100vh;
}
code, pre, textarea, .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Barre du haut */
.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-left)) 10px max(16px, env(safe-area-inset-right));
}
.bar-inner { max-width: max(1180px, 80vw); margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .01em; margin-right: auto; display: flex; align-items: baseline; gap: 10px; color: var(--ink); text-decoration: none; }
a.brand:hover { text-decoration: underline; }
.brand.inactif { pointer-events: none; cursor: default; }
.brand small { font-weight: 500; color: var(--muted); font-size: 13px; }
.stat { font-size: 14px; color: var(--muted); }
.stat b { color: var(--ink); font-weight: 600; }
.timer { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 17px; padding: 3px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.timer.low { color: var(--warn); border-color: currentColor; }
.qid-exam { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.q-timer-note { margin-left: auto; font-size: 13px; }
.q-timer { font-family: "IBM Plex Mono", monospace; font-weight: 600; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); }
.q-timer.low { color: var(--ko); border-color: currentColor; }
.theme-btn { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; white-space: nowrap; }
.progress { height: 3px; background: var(--line); }
.progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

main { max-width: max(1180px, 80vw); margin: 0 auto; padding: 28px 16px 64px; }
.narrow { max-width: max(860px, 60vw); margin: 0 auto; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 28px; }
@media (max-width: 600px) { .card { padding: 20px 16px; } }

h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 20px; line-height: 1.35; margin: 0; font-weight: 600; }
h3 { font-size: 16px; margin: 0 0 10px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
:not(pre) > code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: .9em; word-break: break-word; }

/* Accueil */
.rules { list-style: none; padding: 0; margin: 20px 0 24px; display: grid; gap: 10px; }
.rules li { display: flex; gap: 12px; align-items: baseline; }
.rules .k { flex: 0 0 120px; font-weight: 600; font-size: 14px; color: var(--muted); }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; margin-top: 20px; }

a { color: var(--accent); }
a.btn { display: inline-block; text-decoration: none; }
.lien-epreuve { margin-top: 16px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 18px; border-radius: 8px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn.danger { color: var(--ko); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
.actions .hint { margin-right: auto; font-size: 13px; color: var(--muted); }

/* Question */
.meta { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.c-H { color: var(--c-H); } .c-C { color: var(--c-C); } .c-J { color: var(--c-J); } .c-I { color: var(--c-I); }
.tag { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
pre.code { background: var(--code-bg); color: var(--code-ink); padding: 14px 16px; border-radius: 8px; overflow-x: auto; font-size: 14px; line-height: 1.6; margin: 16px 0 0; }
.opts { display: grid; gap: 10px; margin-top: 20px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); cursor: pointer; }
.opt:hover { border-color: var(--muted); }
.opt input { margin: 4px 0 0; accent-color: var(--accent); flex: none; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt .letter { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--muted); flex: none; }

/* Exercice pratique */
.statement p { margin: 0 0 8px; }
.statement ol { margin: 4px 0 8px; padding-left: 22px; }
.ws { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; margin-top: 20px; }
@media (max-width: 860px) { .ws { grid-template-columns: 1fr; } }
.ide, .out { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ide { background: var(--code-bg); border-color: var(--code-line); }
.ide-bar, .out-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; font-size: 13px; }
.ide-bar { background: #151b25; color: #aab3c2; border-bottom: 1px solid var(--code-line); }
.ide-bar .file { font-family: "IBM Plex Mono", monospace; color: #e9e4d6; margin-right: auto; }
.ide-bar button { background: transparent; color: #e9e4d6; border: 1px solid #3a4557; border-radius: 6px; padding: 3px 10px; font-size: 13px; }
.ide-bar button.run { background: #2c7a4b; border-color: #2c7a4b; color: #fff; }
.editor { display: flex; min-height: 340px; flex: 1; }
.gutter { margin: 0; padding: 12px 8px 12px 12px; color: #5f6b7e; text-align: right; user-select: none; overflow: hidden; font-size: 14px; line-height: 1.6; min-width: 40px; }
.editor textarea { flex: 1; min-width: 0; resize: vertical; min-height: 340px; border: 0; outline: 0; background: transparent; color: var(--code-ink); padding: 12px 12px 12px 4px; font-size: 14px; line-height: 1.6; tab-size: 2; white-space: pre; overflow: auto; }
.out { background: var(--surface-2); }
.out-bar { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; border-bottom: 1px solid var(--line); }
.preview { width: 100%; height: 220px; border: 0; background: #fff; display: block; }
.console { font-family: "IBM Plex Mono", monospace; font-size: 13px; padding: 8px 12px; min-height: 90px; max-height: 200px; overflow: auto; flex: 1; }
.console div { padding: 2px 0; border-bottom: 1px dashed var(--line); white-space: pre-wrap; word-break: break-word; }
.console .error { color: var(--ko); }
.console .warn { color: var(--warn); }
.console .info { color: var(--muted); font-style: italic; }
.console .empty { color: var(--muted); border: 0; font-family: "IBM Plex Sans", sans-serif; }
.checker { position: fixed; left: -10000px; top: 0; width: 800px; height: 600px; border: 0; }

/* Résultats */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } }
.score { font-family: "IBM Plex Mono", monospace; font-size: 64px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.score small { font-size: 22px; color: var(--muted); font-weight: 500; }
.level-name { font-size: 22px; font-weight: 700; margin-top: 6px; }
.bands { display: grid; grid-template-columns: 350fr 200fr 175fr 150fr 125fr; gap: 3px; margin-top: 8px; position: relative; padding-top: 18px; }
.bands span { height: 10px; background: var(--line); border-radius: 2px; }
.bands span.on { background: var(--accent); }
.bands .marker { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--accent); }
.band-labels { display: grid; grid-template-columns: 350fr 200fr 175fr 150fr 125fr; gap: 3px; font-size: 11px; color: var(--muted); margin-top: 4px; }
.band-labels span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpis { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 16px; font-size: 14px; color: var(--muted); }
.kpis b { display: block; font-size: 20px; color: var(--ink); font-family: "IBM Plex Mono", monospace; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.cat-row { display: grid; grid-template-columns: 110px 1fr 56px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.cat-row:last-child { border-bottom: 0; }
.deroule { margin-top: 20px; }
svg.progression { width: 100%; height: auto; display: block; margin-top: 8px; }
svg.progression .grille { stroke: var(--line); stroke-width: 1; }
svg.progression .lbl, svg.progression .num { fill: var(--muted); font: 600 11px "IBM Plex Sans", sans-serif; text-transform: uppercase; }
svg.progression rect.ok { fill: var(--ok); }
svg.progression rect.ko { fill: var(--ko); }
svg.progression rect.sans { fill: var(--ko-soft); stroke: var(--ko); stroke-width: 1.5; }
svg.progression .niveau { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; opacity: .7; }
.legende { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legende .pt { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legende .pt.ok { background: var(--ok); } .legende .pt.ko { background: var(--ko); }
.legende .pt.sans { background: var(--ko-soft); border: 1.5px solid var(--ko); }
.legende .pt.ligne { height: 2px; vertical-align: 4px; background: var(--ink); opacity: .7; }
.cat-row { grid-template-columns: 110px 1fr 56px 100px; }
.cat-row .niv { font-size: 13px; font-weight: 600; text-align: right; }

.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter span { display: block; height: 100%; background: currentColor; }
.cat-row .n { font-family: "IBM Plex Mono", monospace; text-align: right; }
.envoi { margin: 0 0 12px; font-size: 14px; }
.envoi-ok { color: var(--ok); font-weight: 600; }
.envoi-ko { color: var(--ko); }
.copy-box { width: 100%; min-height: 150px; font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface-2); color: var(--ink); resize: vertical; }
.review { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 14px; }
.rv { min-width: 0; border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px; padding: 16px 18px; background: var(--surface); }
.rv.bad { border-left-color: var(--ko); }
.rv .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: 14px; }
.rv .qid { font-size: 12px; }
.rv ul.criteres { margin-top: 10px; }
.rv .score-exo { font-weight: 600; font-size: 14px; margin: 6px 0 0; }
.rv .temps { font-size: 12px; font-family: "IBM Plex Mono", monospace; }
.rv .sortie { font-size: 12px; font-weight: 600; color: var(--warn); }
.rv .verdict { margin-left: auto; font-weight: 700; font-size: 13px; }
.rv .verdict.ok { color: var(--ok); } .rv .verdict.ko { color: var(--ko); }
.rv ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; font-size: 15px; }
.rv li { padding: 5px 10px; border-radius: 6px; }
.rv li.good { background: var(--ok-soft); }
.rv li.picked { background: var(--ko-soft); }
.rv li .mark { font-weight: 700; margin-right: 6px; }
.rv .expl { margin-top: 10px; font-size: 14px; color: var(--muted); }
.rv .statement.expl { margin: 10px 0 14px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 4px; color: var(--ink); font-size: 14px; }
.rv .statement.expl p { margin: 6px 0; }
.rv pre.code { font-size: 13px; margin-top: 8px; }
.rv details { margin-top: 8px; font-size: 14px; }
.rv summary { cursor: pointer; font-weight: 600; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
.section-title h2 { font-size: 20px; }
/* Éditeur à onglets */
.ide-tabs { display: flex; gap: 2px; margin-right: auto; flex-wrap: wrap; min-width: 0; }
.ide-bar button { white-space: nowrap; }
.ide-bar .ide-tab { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: #8b95a7; padding: 4px 10px; font-family: "IBM Plex Mono", monospace; font-size: 13px; }
.ide-bar .ide-tab.on { color: #e9e4d6; border-bottom-color: #8fb4e3; }
.ide-lock { background: #2a2416; color: #f0c674; font-size: 12px; padding: 6px 12px; border-bottom: 1px solid var(--code-line); }
.ide-lock[hidden] { display: none; }
.editor textarea.locked { color: #9aa3b2; }
.console .repete:empty { display: none; }
.console .repete { display: inline-block; min-width: 18px; padding: 0 5px; margin-right: 6px; border-radius: 9px; background: var(--ko); color: #fff; font-size: 11px; text-align: center; }
.rv .fichier { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); margin: 10px 0 0; }

.filtres { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 6px; }
.filtres select, .filtres input { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.filtres input { flex: 1; min-width: 220px; }
.rv.banque { border-left-color: var(--accent); }
.rv .verdict.niveau { color: var(--muted); }

pre.code.trou { line-height: 2.1; }
.trou-input { font: inherit; font-size: 14px; padding: 2px 6px; margin: 0 2px; border: 0; border-bottom: 2px solid #8fb4e3; border-radius: 4px 4px 0 0; background: #2c3646; color: #fff; }
.trou-input:focus { outline: 2px solid #8fb4e3; }
.lignes { border-radius: 8px; overflow-x: auto; background: var(--code-bg); margin-bottom: 12px; }
.lignes .ligne { display: flex; align-items: baseline; gap: 12px; width: 100%; border: 0; background: transparent; color: var(--code-ink); text-align: left; padding: 5px 12px; font-size: 14px; border-left: 4px solid transparent; }
button.ligne { cursor: pointer; }
button.ligne:hover { background: #2a3445; }
.lignes .ligne.on { background: #4a2a2a; border-left-color: #f08a84; }
.lignes .ligne .no { color: #6f7b8f; font-family: "IBM Plex Mono", monospace; font-size: 12px; min-width: 18px; text-align: right; }
.lignes .ligne code { background: none; color: inherit; padding: 0; white-space: pre; }
.lignes.correction .ligne.faute { background: #3a2a1d; border-left-color: #f0a650; }
.lignes.correction .ligne.erreur { background: #4a2a2a; border-left-color: #f08a84; }
.lignes .mark-ligne { margin-left: auto; font-size: 12px; font-weight: 600; color: #f0c674; white-space: nowrap; }
.btn.aucune.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.doc-banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; margin: 12px 0 0; font-size: 14px; }
.doc-banner a { font-weight: 600; }

.zone-commentaire { margin-top: 18px; font-size: 14px; }
.zone-commentaire summary { cursor: pointer; color: var(--muted); }
.zone-commentaire textarea { width: 100%; margin-top: 8px; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); resize: vertical; }
.rv .com { font-size: 14px; background: var(--accent-soft); border-radius: 6px; padding: 6px 10px; margin: 0 0 8px; }

.historique { margin-top: 20px; }
svg.courbe { width: 100%; height: auto; display: block; margin: 6px 0 10px; }
svg.courbe .grille { stroke: var(--line); }
svg.courbe .lbl { fill: var(--muted); font: 600 11px "IBM Plex Sans", sans-serif; text-transform: uppercase; }
svg.courbe .trait { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
svg.courbe .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
svg.courbe .val { fill: var(--ink); font: 600 12px "IBM Plex Mono", monospace; }
.table-scroll { overflow-x: auto; }
.histo-table { font-size: 14px; white-space: nowrap; }
.delta { font-size: 12px; font-weight: 600; }
.delta.up { color: var(--ok); } .delta.down { color: var(--ko); }

.consultation { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-weight: 600; }

.images { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.image-opt { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); cursor: pointer; font-weight: 600; }
.image-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); outline: 2px solid var(--accent); }
.image-opt.good { border-color: var(--ok); background: var(--ok-soft); }
.image-opt.picked { border-color: var(--ko); background: var(--ko-soft); }
.image-opt .svg-img { width: 100%; max-width: 160px; height: auto; background: #fff; border-radius: 4px; }
.image-opt input { accent-color: var(--accent); }

/* Questions interactives */
.inter { margin-top: 18px; }
.aide { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
table.vf { width: 100%; border-collapse: collapse; font-size: 15px; }
table.vf th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); }
table.vf td { padding: 10px; border-bottom: 1px solid var(--line); }
table.vf th:nth-child(n+2), .vf-choix { text-align: center; width: 90px; }
.vf-choix input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
table.vf tr.good td { background: var(--ok-soft); }
table.vf tr.picked td { background: var(--ko-soft); }
.listes { display: grid; gap: 16px; }
.liste-ligne { display: grid; gap: 6px; }
.liste-ligne p { margin: 0; }
.liste-ligne select { font: inherit; font-family: "IBM Plex Mono", monospace; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); max-width: 100%; justify-self: start; }
.rl { position: relative; display: grid; grid-template-columns: 1fr 1fr; column-gap: clamp(60px, 12vw, 200px); align-items: center; }
.rl-svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 1; }
.rl-svg path { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.rl-svg path.temp { stroke-dasharray: 6 5; opacity: .7; }
.rl-col { display: grid; gap: 14px; }
.rl-item { position: relative; display: flex; align-items: center; gap: 10px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); font-size: 14px; touch-action: none; }
.rl-item.g { justify-content: space-between; }
.rl-item.lie { border-color: var(--accent); }
.rl-item.sel { outline: 2px solid var(--accent); background: var(--accent-soft); }
.rl-dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--surface); }
.gl { display: grid; grid-template-columns: minmax(150px, 1fr) 3fr; gap: 16px; }
@media (max-width: 700px) { .gl { grid-template-columns: 1fr; } }
.gl-pool { border: 1px dashed var(--muted); border-radius: 8px; padding: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.gl-titre { margin: 0 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.gl-chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 10px; cursor: grab; font-size: 14px; text-align: center; }
.gl-chip.sel { outline: 2px solid var(--accent); }
.gl-chip code { background: none; padding: 0; }
.gl-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.gl-schema { display: grid; gap: 6px; }
.gl-zone { border: 2px dashed var(--line); border-radius: 8px; padding: 10px; min-height: 100px; cursor: pointer; }
.gl-zone.schema { --zc: #888; border: 0; border-left: 6px solid var(--zc); background: color-mix(in srgb, var(--zc) 28%, var(--surface)); min-height: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.gl-zone.schema .gl-decor { order: 2; margin-left: auto; }
.gl-decor { font-size: 12px; color: var(--muted); font-style: italic; }
.gl-bacs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.gl-zone.over, .gl-pool.over { outline: 2px solid var(--accent); }
.rv-table { margin-top: 8px; }

</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="brand" id="accueil" href="#" title="Accueil">Examen blanc <small>Développement web · simulation</small></a>
    <div class="stat" id="who"></div>
    <div class="stat" id="count"></div>
    <div class="timer" id="timer" hidden>90:00</div>
    <button type="button" class="theme-btn" id="theme">☾ Sombre</button>
  </div>
</header>
<div class="progress"><span id="bar"></span></div>
<main id="app"></main>

<script>
let BANK = [];

// ─── Chargement des questions (questions.json) ───
const CODES = { "HTML": "H", "CSS": "C", "JavaScript": "J", "Intégration": "I" };
const txt = (v) => Array.isArray(v) ? v.join("\n") : (v || "");
async function chargerQuestions() {
  const rep = await fetch("questions.json", { cache: "no-cache" });
  if (!rep.ok) throw new Error("questions.json introuvable (" + rep.status + ")");
  const data = await rep.json();
  const bank = [];
  (data.qcm || []).forEach((q, i) => {
    const c = CODES[q.categorie];
    if (!c || !(q.niveau >= 1 && q.niveau <= 5) || !Array.isArray(q.options) || ![4, 5].includes(q.options.length) || !(q.reponse >= 0 && q.reponse < q.options.length)) {
      console.warn("QCM ignoré (index " + i + ") :", q.question);
      return;
    }
    const d = { id: q.id || c + "-q" + i, c, n: q.niveau, q: txt(q.question), o: q.options, a: q.reponse, e: txt(q.explication) };
    if (q.code) d.code = txt(q.code);
    bank.push(d);
  });
  (data.interactives || []).forEach((q, i) => {
    const c = CODES[q.categorie];
    const t = { vraifaux: "vf", liste: "liste", relier: "relier", glisser: "glisser", trou: "trou", lignes: "lignes", images: "images", multiple: "multiple" }[q.type];
    if (!c || !t || !(q.niveau >= 1 && q.niveau <= 5)) { console.warn("Question interactive ignorée (index " + i + ")"); return; }
    const d = { id: q.id || c + "-i" + i, c, n: q.niveau, t, q: txt(q.question), e: txt(q.explication) };
    if (q.code) d.code = txt(q.code);
    try {
      if (t === "vf") d.aff = q.affirmations.map((a) => [a.texte, a.vrai === true]);
      if (t === "liste") d.phr = q.phrases.map((p) => [p.texte, p.options, p.reponse]);
      if (t === "trou") d.rep = q.reponses.map((v) => (Array.isArray(v) ? v : [v]));
      if (t === "images") { d.images = q.images.map(txt); d.a = q.reponse; }
      if (t === "multiple") { d.o = q.options; d.bonnes = q.reponses; }
      if (t === "lignes") { d.lignes = q.lignes; d.fautes = (q.erreurs || []).map((n) => n - 1); }
      if (q.documentation) d.doc = { url: q.documentation.lien, titre: q.documentation.titre || q.documentation.lien };
      if (q.chrono_secondes) d.chrono = q.chrono_secondes;
      if (t === "relier") { d.paires = q.paires.map((p) => [p.gauche, p.droite]); d.intrus = q.intrus || []; }
      if (t === "glisser") {
        d.etiq = q.etiquettes;
        d.zones = q.zones.map((z) => ({ titre: z.titre, rep: z.reponses, aire: z.aire, couleur: z.couleur, decor: z.decor }));
        if (q.grille) d.grille = { col: q.grille.colonnes, lig: q.grille.lignes };
      }
    } catch (e) {
      console.warn("Question interactive mal formée (index " + i + ")", e);
      return;
    }
    bank.push(d);
  });
  (data.pratiques || []).forEach((q, i) => {
    const c = CODES[q.categorie];
    if (!c || !(q.niveau >= 1 && q.niveau <= 5) || !(q.verification || q.criteres) || (!q.fichiers && !["html", "js"].includes(q.fichier))) {
      console.warn("Exercice pratique ignoré (index " + i + ")");
      return;
    }
    let start = {}, lock = {}, sol = {};
    if (q.fichiers) {
      for (const k of FICHIERS) {
        const f = q.fichiers[k] || {};
        start[k] = txt(f.code);
        lock[k] = f.verrouille === true;
        if (q.solution && q.solution[k] != null) sol[k] = txt(q.solution[k]);
      }
    } else {
      // ancien format (un seul fichier) : converti en 3 fichiers
      const js = q.fichier === "js";
      start = { html: js ? DOC_VIDE : txt(q.depart), css: "", js: js ? txt(q.depart) : "" };
      lock = { html: js, css: true, js: !js };
      sol = js ? { js: txt(q.solution) } : { html: txt(q.solution) };
    }
    const criteres = Array.isArray(q.criteres) && q.criteres.length ? q.criteres.map((k) => [k.nom, txt(k.test)]) : null;
    bank.push({ id: q.id || c + "-p" + i, c, n: q.niveau, q: txt(q.enonce), p: "multi", start, lock, sol, apres: txt(q.apres), attendu: q.rendu_attendu === true, check: txt(q.verification), criteres, e: txt(q.explication) });
  });
  return bank;
}

const CATS = { H: "HTML", C: "CSS", J: "JavaScript", I: "Intégration" };
const TOTAL = 35;
const DUREE = 90 * 60 * 1000;
const DUREE_PRAT = 5 * 60 * 1000;
const PART_INTERACTIVES = 0.35;   // part des questions interactives parmi les questions hors exercices   // temps maximum par exercice pratique
const QUOTA = { H: 8, C: 9, J: 11, I: 7 };
const PRAT_POS = [4, 10, 16, 22, 28, 33];          // positions (index 0) des exercices pratiques
const PRAT_CATS = ["H", "C", "J", "J", "I", "I"];
const NIVEAUX = [
  { max: 350, nom: "Initial" },
  { max: 550, nom: "Basique" },
  { max: 725, nom: "Opérationnel" },
  { max: 875, nom: "Avancé" },
  { max: 1000, nom: "Expert" },
];
const KEY = "examen-blanc-web-v1";

let S = null;            // état de l'examen
let pratOK = true;       // les exercices pratiques peuvent-ils être vérifiés ici ?
let tick = null;
const pending = new Map();
let previewToken = null;
let previewSink = null;
let previewReload = null;

const app = document.getElementById("app");
document.getElementById("accueil").addEventListener("click", (e) => allerAccueil(e));

// ─── Bouton de thème (clair par défaut, choix mémorisé) ───
(function () {
  const btn = document.getElementById("theme");
  let theme = "light";
  try { theme = localStorage.getItem("examen-theme") || "light"; } catch (e) {}
  const appliquer = () => {
    document.documentElement.dataset.theme = theme;
    btn.textContent = theme === "dark" ? "☀ Clair" : "☾ Sombre";
    btn.setAttribute("aria-label", theme === "dark" ? "Passer en thème clair" : "Passer en thème sombre");
  };
  appliquer();
  btn.addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    appliquer();
    try { localStorage.setItem("examen-theme", theme); } catch (e) {}
  });
})();


// ─── Outils ───
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    el.append(k.nodeType ? k : String(k));
  }
  return el;
}
function inline(parent, s) {
  const re = /`([^`]+)`|\*\*([^*]+)\*\*/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) parent.append(s.slice(last, m.index));
    if (m[1] !== undefined) parent.append(h("code", {}, m[1]));
    else parent.append(h("strong", {}, m[2]));
    last = re.lastIndex;
  }
  if (last < s.length) parent.append(s.slice(last));
  return parent;
}
function rich(tag, s, cls) { return inline(h(tag, cls ? { class: cls } : {}), s); }
function block(text, classe) {
  const wrap = h("div", { class: "statement" + (classe ? " " + classe : "") });
  let list = null;
  for (const line of text.split("\n")) {
    const m = line.match(/^(\d+\.|-)\s+(.*)$/);   // "1. …" = liste numérotée, "- …" = liste à puces
    const balise = m && (m[1] === "-" ? "UL" : "OL");
    if (m) {
      if (!list || list.tagName !== balise) { list = h(balise.toLowerCase()); wrap.append(list); }
      list.append(rich("li", m[2]));
    } else {
      list = null;
      if (line.trim()) wrap.append(rich("p", line));
    }
  }
  return wrap;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function token() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function save() { if (S && S._consultation) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function clear() { try { localStorage.removeItem(KEY); } catch (e) {} }
function chip(c) { return h("span", { class: "chip c-" + c }, CATS[c]); }
function fmt(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

// ─── Bac à sable (iframe) pour les exercices pratiques ───
const FICHIERS = ["html", "css", "js"];
const NOMS_FICHIERS = { html: "index.html", css: "style.css", js: "script.js" };
const DOC_VIDE = '<!DOCTYPE html>\n<html lang="fr">\n<head>\n  <meta charset="UTF-8">\n  <title>Exercice</title>\n</head>\n<body>\n</body>\n</html>';

// Script injecté en tête de page : renvoie la console et les erreurs (avec la pile d'appels) vers l'examen.
// D = nombre de lignes avant script.js, pour afficher les numéros de ligne de script.js.
function shim(t, apercu, decalage) {
  return '<script>(function(){var T="' + t + '",D=' + (decalage || 0) + ';function s(v){try{if(v===undefined)return"undefined";if(typeof v==="string")return v;if(typeof v==="number"&&isNaN(v))return"NaN";if(v instanceof Error)return v.name+": "+v.message;if(v&&v.nodeType===1)return"<"+v.tagName.toLowerCase()+(v.id?"#"+v.id:"")+">";return JSON.stringify(v)}catch(e){return String(v)}}function p(k,a){try{parent.postMessage({__ex:T,log:[k,Array.prototype.map.call(a,s).join(" ")]},"*")}catch(e){}}["log","info","warn","error","table"].forEach(function(k){var o=console[k];console[k]=function(){p(k,arguments);try{o.apply(console,arguments)}catch(e){}}});var L=function(l){l=+l;return l>D?l-D:l};window.addEventListener("error",function(e){var st=e.error&&e.error.stack;var m=st?String(st):(e.message||"Erreur");var loc=/about:srcdoc:\\d+/.test(m);m=m.replace(/about:srcdoc:(\\d+):(\\d+)/g,function(_,l,c){return"script.js:"+L(l)+":"+c});if(!loc&&e.lineno)m+=" (script.js:"+L(e.lineno)+")";if(m.indexOf("Uncaught")!==0)m="Uncaught "+m;p("error",[m])})' + (apercu ? ';window.addEventListener("submit",function(e){if(!e.defaultPrevented){e.preventDefault();try{parent.postMessage({__ex:T,reload:true},"*")}catch(x){}}})' : '') + '})()<\/script>';
}
// Vérification : corps de fonction exécuté après le chargement, avec le code source des 3 fichiers (code = HTML, css, js)
// tests = liste de corps de fonctions (un par critère), exécutés dans l'ordre ; renvoie { ok, res: [true/false…] }
function checkScript(tests, t, f) {
  const j = (s) => JSON.stringify(s || "").replace(/</g, "\\u003c");
  f = f || {};
  if (!Array.isArray(tests)) tests = [tests];
  const corps = tests.map((b) => 'try{R.push(!!(function(){' + b + '})())}catch(e){R.push(false)}').join("");
  return '<script>window.addEventListener("load",function(){setTimeout(function(){var R=[];(function(code,css,js){' + corps + '})(' + j(f.html) + ',' + j(f.css) + ',' + j(f.js) + ');parent.postMessage({__ex:"' + t + '",ok:R.length>0&&R.every(Boolean),res:R},"*")},60)})<\/script>';
}
// Assemble les 3 fichiers en une page : le CSS dans le <head>, le JS en bas du <body>, puis le script caché « apres » (tests)
function assembler(q, f) {
  let d = f.html || "";
  const style = "<style>\n" + (f.css || "") + "\n</style>\n";
  const finHead = d.search(/<\/head>/i);
  d = finHead >= 0 ? d.slice(0, finHead) + style + d.slice(finHead) : style + d;
  const finBody = d.toLowerCase().lastIndexOf("</body>");
  const avant = finBody >= 0 ? d.slice(0, finBody) : d;
  const ouverture = "<script>\n";
  const decalage = (avant + ouverture).split("\n").length - 1;
  const scripts = ouverture + (f.js || "") + "\n<\/script>\n" + (q.apres ? "<script>\n" + q.apres + "\n<\/script>\n" : "");
  return { doc: avant + scripts + (finBody >= 0 ? d.slice(finBody) : ""), decalage };
}
function buildDoc(q, f, extra, t, apercu) {
  const { doc, decalage } = assembler(q, f);
  let d = doc;
  const head = d.search(/<head(\s[^>]*)?>/i);
  if (head >= 0) {
    const end = d.indexOf(">", head) + 1;
    d = d.slice(0, end) + shim(t, apercu, decalage) + d.slice(end);
  } else {
    d = shim(t, apercu, decalage) + d;
  }
  const body = d.toLowerCase().lastIndexOf("</body>");
  return body >= 0 ? d.slice(0, body) + extra + d.slice(body) : d + extra;
}
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || typeof d !== "object" || !d.__ex) return;
  if ("ok" in d && pending.has(d.__ex)) pending.get(d.__ex)({ ok: d.ok === true, res: Array.isArray(d.res) ? d.res.map(Boolean) : null });
  else if (d.log && d.__ex === previewToken && previewSink) previewSink(d.log[0], d.log[1]);
  else if (d.reload && d.__ex === previewToken && previewReload) previewReload();
});
function runInSandbox(html, t) {
  return new Promise((resolve) => {
    const fr = h("iframe", { sandbox: "allow-scripts", class: "checker", title: "Vérification", "aria-hidden": "true", tabindex: "-1" });
    const done = (v) => { pending.delete(t); fr.remove(); resolve(v); };
    pending.set(t, done);
    setTimeout(() => { if (pending.has(t)) done({ ok: false, res: null }); }, 3000);
    fr.srcdoc = html;
    document.body.append(fr);
  });
}
function runCheck(q, f) {
  const t = token();
  return runInSandbox(buildDoc(q, f, checkScript(q.criteres ? q.criteres.map((c) => c[1]) : q.check, t, f), t), t);
}
const nomsCriteres = (q) => (q.criteres ? q.criteres.map((c) => c[0]) : ["Vérification de l'exercice"]);
const scoreCriteres = (res) => (res && res.length ? Math.round((100 * res.filter(Boolean).length) / res.length) : 0);
function probe() {
  const t = token();
  return runInSandbox('<!DOCTYPE html><html><body>' + checkScript("return 1 + 1 === 2;", t) + '</body></html>', t).then((r) => r.ok);
}

// ─── Déroulement ───
function nouvelExamen(nom) {
  const pc = shuffle(PRAT_CATS.slice());
  const reste = { ...QUOTA };
  if (pratOK) for (const c of pc) reste[c]--;
  const qcm = shuffle(Object.entries(reste).flatMap(([c, n]) => Array(n).fill(c)));
  const seq = [];
  for (let i = 0; i < TOTAL; i++) {
    if (pratOK && PRAT_POS.includes(i)) seq.push({ c: pc.pop(), p: true });
    else seq.push({ c: qcm.pop(), p: false, i: false });
  }
  // environ une place sur trois (hors exercices) pour les questions interactives (Vrai/Faux, listes, relier, glisser…)
  const places = shuffle(seq.filter((s) => !s.p));
  places.slice(0, Math.round(places.length * PART_INTERACTIVES)).forEach((s) => { s.i = true; });
  S = { id: token().slice(0, 6), nom, seq, idx: 0, level: 2, used: [], answers: [], cur: null, start: Date.now(), end: Date.now() + DUREE, fini: false };
  preparer();
  save();
  envoyer({ type: "debut", id: S.id, nom });
}

// ─── Envoi automatique au formateur (fonction Vercel → webhook Discord) ───
let envoiEnCours = false;
async function envoyer(data) {
  try {
    const rep = await fetch("api/resultat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
    return rep.ok && (await rep.json()).ok === true;
  } catch (e) {
    return false;
  }
}
async function envoyerResultat() {
  if (!S || !S.fini || S._consultation || S.envoi === "ok" || envoiEnCours) return;
  envoiEnCours = true;
  majStatut();
  const sc = score(S.answers);
  const st = stats();
  const ok = await envoyer({
    type: "fin", id: S.id, nom: S.nom, score: sc, niveau: niveau(sc), ok: st.ok, total: TOTAL,
    cats: Object.fromEntries(Object.keys(CATS).map((c) => [c, [st.parCat[c].ok, st.parCat[c].n]])),
    niveaux: Object.fromEntries(Object.keys(CATS).map((c) => [c, niveauDomaine(c)])),
    pOk: st.pOk, pN: st.pN, pScore: st.pScore,
    tentative: infosTentative(),
    duree: Math.round(((S.endedAt || Date.now()) - S.start) / 60000),
    timeout: S.answers.some((a) => a.timeout),
    reussies: S.answers.map((a, i) => ({ a, i })).filter(({ a }) => a.ok).map(({ a, i }) => ({ i: i + 1, id: a.id != null ? BANK[a.id].id : null, t: Math.round((a.temps || 0) / 1000), s: a.score })),
    erreurs: S.answers.map((a, i) => ({ a, i })).filter(({ a }) => !a.ok).map(({ a, i }) => ({ i: i + 1, id: a.id != null ? BANK[a.id].id : null, t: Math.round((a.temps || 0) / 1000), s: a.score != null ? a.score : a.id != null && BANK[a.id].p ? 0 : null })),
    sorties: (S.sorties && S.sorties.n) || 0,
    sortiesMs: (S.sorties && S.sorties.ms) || 0,
  });
  envoiEnCours = false;
  S.envoi = ok ? "ok" : "echec";
  save();
  majStatut();
}
function majStatut() {
  const el = document.getElementById("envoi-statut");
  if (!el) return;

function choisir(slot) {
  const libre = (i) => !S.used.includes(i);
  const genre = (q) => (q.p ? "p" : q.t ? "i" : "q");
  const voulu = slot.p ? "p" : slot.i ? "i" : "q";
  const tous = BANK.map((q, i) => i).filter(libre);
  let pool = tous.filter((i) => BANK[i].c === slot.c && genre(BANK[i]) === voulu);
  if (!pool.length) pool = tous.filter((i) => genre(BANK[i]) === voulu);                     // autre domaine
  if (!pool.length && !slot.p) pool = tous.filter((i) => genre(BANK[i]) !== "p");           // autre format
  const dist = (i) => Math.abs(BANK[i].n - S.level);
  const min = Math.min(...pool.map(dist));
  const best = pool.filter((i) => dist(i) === min);
  return best[Math.floor(Math.random() * best.length)];
}
function preparer() {
  const id = choisir(S.seq[S.idx]);
  S.used.push(id);
  const q = BANK[id];

  if (q.p || q.chrono) S.cur.deadline = Date.now() + (q.p ? DUREE_PRAT : q.chrono * 1000);
}

  S.answers.push({ id: S.cur.id, c: q.c, ok, level: S.level, order: S.cur.order, temps: Date.now() - (S.cur.debut || Date.now()), sorties: S.cur.sorties || 0, ...(com ? { commentaire: com } : {}), ...extra });
  if (com) envoyer({ type: "commentaire", id: S.id, nom: S.nom, i: S.idx + 1, qid: q.id, texte: com });
  S.level = Math.min(5, Math.max(1, S.level + (ok ? 1 : -1)));

}
function terminer() {
  while (S.answers.length < TOTAL) {
    const i = S.answers.length;
    const id = S.cur && S.answers.length === S.idx ? S.cur.id : null;
    S.answers.push({ id, c: S.seq[i].c, ok: false, level: S.level, order: S.cur ? S.cur.order : null, timeout: true, temps: S.cur && S.cur.debut ? Math.min(Date.now(), S.end) - S.cur.debut : 0 });

function duree(ms) {
  const s = Math.round(ms / 1000);
  return s < 60 ? s + " s" : Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0");
}

// ─── Score (estimation adaptative) ───
function score(answers) {
  // aucune bonne réponse (ni réussite partielle sur un exercice) : 0 pointé
  if (!answers.some((a) => a.ok || a.score > 0)) return 0;
  // niveau moyen atteint + bonus / malus selon le taux de réussite (les dernières questions comptent plus)
  let sw = 0, sl = 0, sr = 0;
  answers.forEach((a, i) => {
    const w = 1 + i / (TOTAL - 1);
    sw += w;
    sl += w * a.level;
    sr += w * (a.score != null ? a.score / 100 : a.ok ? 1 : 0);   // score partiel des exercices
  });
  const L = sl / sw + 0.5 + 1.5 * (sr / sw - 0.85);
  // repères : 2 bonnes réponses sur 3 ≈ 820 (Avancé), 1 erreur sur 5 ≈ 895 (Expert), tout juste = 1000
  const pts = [[0.5, 0], [1, 150], [2, 400], [3, 580], [4, 700], [5, 860], [5.5, 1000]];
  if (L <= pts[0][0]) return 0;
  for (let i = 1; i < pts.length; i++) {
    if (L <= pts[i][0]) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      return Math.round(y0 + (y1 - y0) * (L - x0) / (x1 - x0));
    }
  }
  return 1000;
}

const TYPES = { vf: "Vrai / Faux", liste: "Listes déroulantes", relier: "Relier", glisser: "Glisser-déposer", trou: "Texte à compléter", lignes: "Lignes à cliquer", images: "QCM en images", multiple: "Plusieurs réponses" };

function melanger(q) {
  const idx = (n) => shuffle(Array.from({ length: n }, (_, i) => i));
  if (q.t === "relier") return { g: idx(q.paires.length), d: idx(q.paires.length + q.intrus.length) };
  if (q.t === "glisser") return { e: idx(q.etiq.length) };
  if (q.t === "liste") return { o: q.phr.map((p) => idx(p[1].length)) };
  if (q.t === "images") return { ordre: idx(q.images.length) };
  if (q.t === "multiple") return { ordre: idx(q.o.length) };
  return null;
}
const droites = (q) => q.paires.map((p) => p[1]).concat(q.intrus);
const zoneUnique = (q, z) => !!q.grille && q.zones[z].rep.length === 1;

function corriger(q, rep) {
  if (q.t === "vf") return q.aff.every((a, i) => rep[i] === a[1]);
  if (q.t === "liste") return q.phr.every((p, i) => rep[i] === p[2]);
  if (q.t === "relier") return q.paires.every((_, i) => rep[i] === i);
  if (q.t === "glisser") return q.zones.every((z, zi) => {
    const poses = q.etiq.filter((_, i) => rep[i] === zi).sort().join("|");
    return poses === z.rep.slice().sort().join("|");
  });
  if (q.t === "images") return rep === q.a;
  if (q.t === "multiple") return Array.isArray(rep) && rep.length === q.bonnes.length && q.bonnes.every((b) => rep.includes(b));
  if (q.t === "trou") {
    const norm = (s) => String(s || "").trim().replace(/;$/, "").replace(/\s+/g, "");
    return q.rep.every((variantes, i) => variantes.some((v) => norm(v) === norm(rep[i])));
  }
  if (q.t === "lignes") {
    if (!q.fautes.length) return rep.aucune === true;
    return !rep.aucune && rep.lignes.length === q.fautes.length && q.fautes.every((f) => rep.lignes.includes(f));
  }
  return false;
}

function stats() {
  const parCat = {};
  for (const c of Object.keys(CATS)) parCat[c] = { ok: 0, n: 0 };
  let ok = 0, pOk = 0, pN = 0, pTotal = 0;
  for (const a of S.answers) {
    parCat[a.c].n++;
    if (a.ok) { parCat[a.c].ok++; ok++; }
    if (a.id != null && BANK[a.id].p) { pN++; pTotal += a.score || (a.ok ? 100 : 0); if (a.ok) pOk++; }
  }
  return { parCat, ok, pOk, pN, pScore: pN ? Math.round(pTotal / pN) : 0 };
}

function copier(text, btn) {
  const fini = (ok) => { btn.textContent = ok ? "Copié ✓" : "Sélectionne le texte et copie-le"; setTimeout(() => { btn.textContent = "Copier pour Discord"; }, 2500); };
  const fallback = () => {

    box.focus(); box.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    fini(ok);
  };
  try {

function graphiqueProgression() {
  const NS = "http://www.w3.org/2000/svg";

  const n = S.answers.length, G = 34, D = 118, W = 760, Hh = 200, haut = 12, pas = (W - G - D) / n;
  const y = (niv) => haut + Hh - (niv / 5) * Hh;
  const svg = el("svg", { viewBox: `0 0 ${W} ${haut + Hh + 34}`, class: "progression", role: "img", "aria-label": "Difficulté de chaque question et niveau estimé" });
  NIVEAUX.forEach((nv, k) => {
    svg.append(el("line", { x1: G, x2: W - D + 6, y1: y(k + 1), y2: y(k + 1), class: "grille" }));
    const t = el("text", { x: W - D + 12, y: y(k + 1) + (Hh / 5) / 2 + 4, class: "lbl" }); t.textContent = nv.nom; svg.append(t);
  });
  svg.append(el("line", { x1: G, x2: W - D + 6, y1: y(0), y2: y(0), class: "grille" }));
  const points = [];
  S.answers.forEach((a, i) => {
    const q = a.id != null ? BANK[a.id] : null;
    const diff = q ? q.n : a.level;
    const x = G + i * pas;
    const sans = !a.ok && (a.timeout || a.passe || a.choix === null);
    const r = el("rect", { x: x + pas * 0.15, y: y(diff), width: pas * 0.7, height: y(0) - y(diff), rx: 2, class: a.ok ? "ok" : sans ? "sans" : "ko" });
    const titre = el("title", {}); titre.textContent = `Q${i + 1}${q ? " · " + q.id : ""} · niveau ${diff} · ${a.ok ? "réussie" : sans ? "sans réponse" : "ratée"}`; r.append(titre);
    svg.append(r);
    if (i % 5 === 0 || i === n - 1) { const t = el("text", { x: x + pas / 2, y: y(0) + 16, class: "num", "text-anchor": "middle" }); t.textContent = i + 1; svg.append(t); }
    points.push(`${x + pas / 2},${y(a.level) + (Hh / 5) / 2}`);
  });
  svg.append(el("polyline", { points: points.join(" "), class: "niveau" }));
  return h("section", { class: "card deroule" },
    h("h3", {}, "Déroulement du test"),
    h("p", { class: "muted aide" }, "Chaque barre est une question : sa hauteur indique sa difficulté. La ligne montre le niveau estimé avant chaque question : il monte après une bonne réponse et descend après une erreur."),

}

}

// ─── Vérification de la banque dans le navigateur (adresse + #verifier) ───
function bonneReponse(q) {
  if (q.t === "vf") return q.aff.map((a) => a[1]);
  if (q.t === "liste") return q.phr.map((p) => p[2]);
  if (q.t === "relier") return q.paires.map((_, i) => i);
  if (q.t === "glisser") return q.etiq.map((e) => q.zones.findIndex((z) => z.rep.includes(e)));
  if (q.t === "trou") return q.rep.map((v) => v[0]);
  if (q.t === "lignes") return { lignes: q.fautes.slice(), aucune: !q.fautes.length };
  if (q.t === "images") return q.a;
  if (q.t === "multiple") return q.bonnes.slice();
  return null;
}
async function renderVerifier() {
  document.getElementById("who").textContent = "Vérification";
  document.getElementById("accueil").classList.remove("inactif");
  const lignes = h("tbody");
  const resume = h("p", { class: "muted" }, "Vérification en cours…");
  app.replaceChildren(h("section", { class: "card" },
    h("p", { class: "tag" }, "Page formateur"), h("h1", {}, "Vérification de la banque"),
    h("p", { class: "muted" }, "Chaque exercice est corrigé avec sa solution (doit valoir 100/100) puis avec son code de départ (ne doit pas tout réussir). Chaque question interactive est corrigée avec sa bonne réponse."),
    resume, h("button", { class: "btn small", onclick: allerAccueil }, "← Accueil")),
    h("section", { class: "card", style: "margin-top:16px" }, h("div", { class: "table-scroll" }, h("table", { class: "vf histo-table" },
      h("thead", {}, h("tr", {}, ["Id", "Format", "Solution", "Départ", "Détail"].map((t) => h("th", {}, t)))), lignes))));
  let ok = 0, ko = 0;
  for (const q of BANK) {
    if (!q.p && !q.t) continue;
    let bon, detail = "";
    if (q.p) {
      const sol = await runCheck(q, { ...q.start, ...q.sol }), dep = await runCheck(q, q.start);
      bon = sol.ok && !dep.ok;
      detail = (sol.ok ? "" : "critères ratés par la solution : " + nomsCriteres(q).filter((_, k) => !(sol.res && sol.res[k])).join(", ") + ". ") + (dep.ok ? "le code de départ réussit déjà tout." : "");
      lignes.append(h("tr", { class: bon ? "" : "picked" }, h("td", { class: "mono" }, q.id), h("td", {}, "Exercice"), h("td", {}, sol.ok ? "✓ 100/100" : "✗ " + scoreCriteres(sol.res) + "/100"), h("td", {}, dep.ok ? "✗ 100/100" : "✓ " + scoreCriteres(dep.res) + "/100"), h("td", {}, detail)));
    } else {
      bon = corriger(q, bonneReponse(q));
      lignes.append(h("tr", { class: bon ? "" : "picked" }, h("td", { class: "mono" }, q.id), h("td", {}, TYPES[q.t] || q.t), h("td", {}, bon ? "✓" : "✗ bonne réponse refusée"), h("td", {}, "—"), h("td", {}, "")));
    }
    bon ? ok++ : ko++;
    resume.textContent = `${ok + ko} vérifiée(s)…`;
  }
  resume.textContent = ko ? `✗ ${ko} problème(s) sur ${ok + ko} questions vérifiées (lignes en rouge).` : `✓ ${ok} exercices et questions interactives vérifiés, aucun problème.`;
}

// ─── Démarrage ───
(async function init() {
  app.replaceChildren(h("p", { class: "muted narrow" }, "Chargement…"));
  try {
    BANK = await chargerQuestions();
  } catch (e) {
    app.replaceChildren(h("div", { class: "narrow card" }, h("h2", {}, "Impossible de charger les questions"), h("p", { class: "muted" }, String(e.message || e))));
    return;
  }
  pratOK = await probe();
  const saved = load();
  if (saved && saved.seq && !saved.fini && Date.now() >= saved.end) {
    S = saved;
    terminer();               // temps écoulé pendant l'absence : l'examen se termine
  } else if (saved && saved.seq && !saved.fini) {
    S = saved;                // examen en cours : il reprend directement là où il s'était arrêté
    demarrerChrono();
  } else if (saved && saved.fini && saved.vue === "resultats") {
    S = saved;                // la page de résultats reste affichée après un rechargement
  }
  const router = () => (location.hash === "#banque" ? renderBanque() : location.hash === "#verifier" ? renderVerifier() : render());
  // formateur : Ctrl + Alt + Maj + Q abandonne l'examen en cours et revient à l'accueil (historique conservé)
  document.addEventListener("keydown", (e) => {
    // la lettre tapée (AZERTY comme QWERTY) ; la position physique seulement si la touche ne donne pas une lettre (ex. Option sur Mac)
    const q = /^[a-z]$/i.test(e.key) ? e.key.toLowerCase() === "q" : e.code === "KeyQ";
    if (!(e.ctrlKey && e.altKey && e.shiftKey && q) || !S || S.fini) return;
    e.preventDefault();
    clearInterval(tick);
    S = null;
    clear();
    render();
    window.scrollTo(0, 0);
  }, true);
  window.addEventListener("hashchange", () => { router(); window.scrollTo(0, 0); });
  router();
})();
</script>
